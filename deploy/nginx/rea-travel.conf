## Example nginx site config for rea-travel
# Copy this to /etc/nginx/sites-available/rea-travel and symlink to sites-enabled
# Replace `example.com` with your domain and adjust paths/ports as needed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name rea-travel.com; # <- change to your domain or IP

    # Increase client upload limit if needed (booking payloads, images)
    client_max_body_size 50M;

    # Serve the Next.js app (proxy to the Next.js server on 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;pm
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Proxy backend API requests to Uvicorn backend on port 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Optional: serve static files directly from Next.js .next (if using standalone output)
    # location /_next/static/ {
    #     alias /var/www/rea-travel/FLIGHT/Frontend/.next/static/;
    #     access_log off;
    # }

    # Optional security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
