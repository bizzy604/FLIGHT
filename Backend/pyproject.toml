[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "flight_backend"
version = "0.1.0"
description = "Flight Booking Portal Backend"
requires-python = ">=3.8"
dependencies = [
    "quart>=0.17.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=0.19.0",
    "quart-cors>=0.3.0",
    "pydantic>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Backend*"]

[tool.pytest.ini_options]
markers = [
    "live: marks tests that require live VDC API access (deselect with '-m \"not live\"')",
    "unit: marks unit tests",
    "integration: marks integration tests"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
